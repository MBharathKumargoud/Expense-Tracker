<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Expense Tracker</title>
    <link rel="stylesheet" href="css/Register.css">
</head>
<body>
    <div class="container">
        <form id="register-form">
            <h2>Register</h2>
            <input type="email" id="register-email" placeholder="Enter your email" required />
            <input type="text" id="register-username" placeholder="Enter your username" required />
            <input type="password" id="register-password" placeholder="Enter your password" required 
                pattern="^(?=.*[A-Za-z])(?=.*\d)(?=.*[@$!%*#?&])[A-Za-z\d@$!%*#?&]{8,}$"
                title="Password must be at least 8 characters long and include at least one letter, one number, and one special character" />
            <input type="password" id="confirm-password" placeholder="Confirm password" required />
            <div id="password-requirements">
                Password must contain:
                <ul>
                    <li id="length">At least 8 characters</li>
                    <li id="letter">At least one letter</li>
                    <li id="number">At least one number</li>
                    <li id="special">At least one special character</li>
                </ul>
            </div>
            <div id="password-match-message"></div>
            <div id="Login-reg">
                <button type="submit" class="Register">Register</button>
            </div>
            <div class="login-link">
                Already have an account? <a href="pages/Login.html">Login here</a>
            </div>
        </form>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        const form = document.getElementById('register-form');
        const password = document.getElementById('register-password');
        const confirmPassword = document.getElementById('confirm-password');
        const passwordMessage = document.getElementById('password-match-message');

        password.addEventListener('input', function() {
            const lengthReq = document.getElementById('length');
            const letterReq = document.getElementById('letter');
            const numberReq = document.getElementById('number');
            const specialReq = document.getElementById('special');

            const val = this.value;
            lengthReq.style.color = val.length >= 8 ? 'green' : 'red';
            letterReq.style.color = /[A-Za-z]/.test(val) ? 'green' : 'red';
            numberReq.style.color = /\d/.test(val) ? 'green' : 'red';
            specialReq.style.color = /[@$!%*#?&]/.test(val) ? 'green' : 'red';
        });

        confirmPassword.addEventListener('input', function() {
            if (this.value !== password.value) {
                passwordMessage.textContent = 'Passwords do not match';
                passwordMessage.style.color = 'red';
            } else {
                passwordMessage.textContent = 'Passwords match';
                passwordMessage.style.color = 'green';
            }
        });

        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('register-email').value;
            const username = document.getElementById('register-username').value;
            const pass = document.getElementById('register-password').value;
            const confirmPass = document.getElementById('confirm-password').value;

            if (pass !== confirmPass) {
                alert('Passwords do not match!');
                return;
            }

            try {
                await registerUser(email, username, pass);
                alert('Registration successful! Please login.');
                window.location.href = 'pages/Login.html';
            } catch (error) {
                alert('Registration failed: ' + (error.message || error));
            }
        });
    </script>
</body>
</html>
