<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="../css/Login.css" />
    <title>Set New Password - Expense Tracker</title>
</head>
<body>
    <div id="container">
        <form id="reset-password-form">
            <h2>Set New Password</h2>
            <input type="password" id="new-password" placeholder="New password" required 
                pattern="^(?=.*[A-Za-z])(?=.*\d)(?=.*[@$!%*#?&])[A-Za-z\d@$!%*#?&]{8,}$"
                title="Password must be at least 8 characters long and include at least one letter, one number, and one special character" />
            <input type="password" id="confirm-new-password" placeholder="Confirm new password" required />
            <div id="Login-reg" style="margin-top: 15px;">
                <button type="submit" class="Login">Reset Password</button>
            </div>
            <div style="margin-top: 15px;">
                <a href="Login.html">Back to Login</a>
            </div>
        </form>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        if (!token) {
            alert('Invalid or missing reset token.');
            window.location.href = 'Login.html';
        }

        document.getElementById('reset-password-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const newPassword = document.getElementById('new-password').value;
            const confirmNewPassword = document.getElementById('confirm-new-password').value;

            if (newPassword !== confirmNewPassword) {
                alert('Passwords do not match!');
                return;
            }

            try {
                await confirmPasswordReset(token, newPassword);
                alert('Password reset successful! Please login with your new password.');
                window.location.href = 'Login.html';
            } catch (error) {
                alert('Password reset failed: ' + (error.message || 'Token expired or invalid.'));
            }
        });
    </script>
</body>
</html>
