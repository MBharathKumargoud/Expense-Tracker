<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="../css/Login.css" />
    <title>Login - Expense Tracker</title>
</head>
<body>
    <div id="container">
        <form id="login-form">
            <h1>Login</h1>
            <input type="email" id="login-email" placeholder="Email" required />
            <input type="password" id="login-password" placeholder="Password" required />
            <div id="Login-reg">
                <button type="submit" class="Login">Login</button>
            </div>
            <div id="forgot">
                <a href="#" class="Forgot" onclick="showForgotPasswordForm()">Forgot password?</a>
            </div>
            <div class="register-link">
                Don't have an account? <a href="../index.html">Register here</a>
            </div>
        </form>

        <!-- Forgot Password Form -->
        <form id="forgot-password-form" style="display: none;">
            <h1>Reset Password</h1>
            <p style="font-size: 0.9em; color: #666; text-align: center; margin: 0;">Enter your email to receive a password reset link.</p>
            <input type="email" id="reset-email" placeholder="Enter your email" required />
            <div id="Login-reg">
                <button type="submit" class="Login">Send Reset Link</button>
            </div>
            <div class="register-link">
                <a href="#" onclick="showLoginForm()">Back to Login</a>
            </div>
        </form>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script>
        const loginForm = document.getElementById('login-form');
        const forgotPasswordForm = document.getElementById('forgot-password-form');

        loginForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            try {
                await loginUser(email, password);
                window.location.href = 'Home.html';
            } catch (error) {
                alert('Login failed: ' + (error.message || 'Invalid credentials'));
            }
        });

        forgotPasswordForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('reset-email').value;

            try {
                const response = await requestPasswordReset(email);
                alert(response.message || 'Password reset request processed. Please check your email for the reset link.');
                showLoginForm();
            } catch (error) {
                alert('Error: ' + (error.message || 'Unable to process reset request'));
            }
        });

        function showForgotPasswordForm() {
            loginForm.style.display = 'none';
            forgotPasswordForm.style.display = 'flex';
        }

        function showLoginForm() {
            loginForm.style.display = 'flex';
            forgotPasswordForm.style.display = 'none';
        }
    </script>
</body>
</html>
