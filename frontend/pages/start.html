<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="../css/start.css" />
    <title>Add Expense - Expense Tracker</title>
</head>
<body>
    <div class="nav-buttons">
        <a href="Home.html" class="nav-button">← Back to Home</a>
        <a href="view.html" class="nav-button">View All Expenses →</a>
    </div>

    <div id="logo-dec">
        <img src="../assets/logo.jpg" alt="logoImage" class="logo_icon">
        <h1>Expense Tracker</h1>
    </div>
    
    <div class="container">
        <form id="expense-form">
            <div id="success-message" class="success-message">
                Expense added successfully!
            </div>
            
            <h1>Enter your Expenses</h1>
            <input type="text" id="expense-name" placeholder="Expense Name" required 
                   pattern="[A-Za-z0-9\s-]{3,50}" 
                   title="Expense name must be between 3 and 50 characters and can contain letters, numbers, spaces and hyphens"/>
            
            <input type="number" id="expense-amount" placeholder="Amount" required 
                   min="0.01" step="0.01"
                   title="Please enter a valid amount greater than 0"/>

            <select id="expense-category" required>
                <option value="" disabled selected>Select Category</option>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Other">Other</option>
            </select>

            <input type="date" id="expense-date" required />
            <button type="submit" class="submit-button">Add Expense</button>
        </form>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/expenses.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            checkAuthGuard();
            document.getElementById('expense-date').valueAsDate = new Date();
        });

        document.getElementById('expense-form').addEventListener('submit', async function(e) {
            e.preventDefault();

            try {
                const expenseName = document.getElementById('expense-name').value.trim();
                const expenseAmount = parseFloat(document.getElementById('expense-amount').value);
                const expenseCategory = document.getElementById('expense-category').value;
                const expenseDate = document.getElementById('expense-date').value;

                if (!expenseName) throw new Error("Please enter an expense name");
                if (isNaN(expenseAmount) || expenseAmount <= 0) throw new Error("Please enter a valid amount greater than 0");
                if (!expenseCategory) throw new Error("Please select a category");
                if (!expenseDate) throw new Error("Please select a date");

                const expense = {
                    name: expenseName,
                    amount: expenseAmount,
                    category: expenseCategory,
                    date: expenseDate
                };

                await addExpense(expense);
                
                const successMessage = document.getElementById('success-message');
                successMessage.style.display = 'block';
                successMessage.textContent = 'Expense added successfully!';
                successMessage.style.backgroundColor = '#4CAF50';
                
                this.reset();
                document.getElementById('expense-date').valueAsDate = new Date();
                
                setTimeout(() => {
                    successMessage.style.display = 'none';
                }, 3000);

            } catch (error) {
                const successMessage = document.getElementById('success-message');
                successMessage.style.display = 'block';
                successMessage.textContent = error.message || 'Error adding expense';
                successMessage.style.backgroundColor = '#f44336';
                
                setTimeout(() => {
                    successMessage.style.display = 'none';
                }, 3000);
            }
        });
    </script>
</body>
</html>
